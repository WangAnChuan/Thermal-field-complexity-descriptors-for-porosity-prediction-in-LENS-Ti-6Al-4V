name: reproduce-claims

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install minimal test dependencies
        run: pip install pandas numpy pytest
      - name: Verify every reported number against the committed results
        run: python tests/test_claims.py
